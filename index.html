<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>International Chronograph</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #090d16;
            --panel-glass: rgba(17, 24, 39, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --accent-cyan: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: linear-gradient(45deg, #06b6d4, #3b82f6);
            filter: blur(140px);
            opacity: 0.12;
            z-index: 0;
        }
        body::before { top: 15%; left: 20%; }
        body::after { bottom: 15%; right: 20%; background: linear-gradient(45deg, #6366f1, #a855f7); }

        .stopwatch-card {
            position: relative;
            z-index: 1;
            background: var(--panel-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            padding: 2.5rem;
            border-radius: 28px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .display-container {
            background: rgba(4, 7, 13, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 2rem 1rem;
            margin-bottom: 2rem;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        #timer {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.5rem;
            font-weight: 300;
            color: var(--text-main);
            letter-spacing: -1px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .controls-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            flex: 1;
            max-width: 120px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: capitalize;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        #start {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            border-color: rgba(6, 182, 212, 0.2);
        }

        #start:hover {
            background: rgba(6, 182, 212, 0.18);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
        }
    </style>
</head>
<body>

    <div class="stopwatch-card">
        <div class="card-label">Chrono / Performance</div>

        <div class="display-container">
            <h2 id="timer">00:00:00</h2>
        </div>

        <div class="controls-grid">
            <button onclick="start()" id="start">start</button>
            <button onclick="stopfunc()">stop</button>
            <button onclick="reset()">reset</button>
        </div>
    </div>

    <script>
        const timer = document.getElementById("timer");
        const startbtn = document.getElementById("start");

        let second = 0;
        let interval = null;

        function start() {
            if (interval) return; // dobara start hone se bachata hai
            startbtn.style.display = "none";
            interval = setInterval(function () {
                second++;
                updateDisplay();
            }, 1000);
        }

        function stopfunc() {
            clearInterval(interval);
            interval = null;
            startbtn.style.display = "inline";
        }

        function reset() {
            clearInterval(interval);
            interval = null;
            second = 0;
            startbtn.style.display = "inline";
            updateDisplay();
        }

        function updateDisplay() {
            const hours = String(Math.floor(second / 3600)).padStart(2, "0");
            const mint = String(Math.floor((second % 3600) / 60)).padStart(2, "0");
            const sec = String(second % 60).padStart(2, "0");
            timer.innerText = `${hours}:${mint}:${sec}`;
        }
    </script>
</body>
</html>
